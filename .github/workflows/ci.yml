name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Type Check + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Type check (server)
        run: npx tsc --noEmit
        working-directory: server

      - name: Test (server)
        run: npx vitest run
        working-directory: server

  extension-lint:
    name: Extension Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json
        run: |
          node -e "
          const m = require('./extension/manifest.json');
          const required = ['manifest_version', 'name', 'version'];
          for (const key of required) {
            if (!m[key]) { console.error('Missing: ' + key); process.exit(1); }
          }
          if (m.manifest_version !== 3) { console.error('Must be Manifest V3'); process.exit(1); }
          console.log('manifest.json valid');
          "

      - name: Check content script syntax
        run: node --check extension/content.js 2>/dev/null || echo "content.js uses modules, skip syntax check"

      - name: Check background script syntax
        run: node --check extension/background.js 2>/dev/null || echo "background.js uses modules, skip syntax check"

      - name: Check popup script syntax
        run: node --check extension/popup.js 2>/dev/null || echo "popup.js uses modules, skip syntax check"
